# hexo-generator-sitemap
sitemap:
  path: 
    - sitemap.xml
    - sitemap.txt
  template: ./template_sitemap/sitemaptemp.xml
  template_txt: ./template_sitemap/sitemaptemp.txt
  rel: false
  tags: true
  categories: true

# hexo-filter-nofollow
nofollow:
  enable: true
  field: site
  exclude:
    - 'xenwayne.top'
    - 'www.xenwayne.top'
    - 'beta.xenwayne.top'
    - 'lightzone.mevisual.com'
    - 'mevisual.com'
    - 'www.mevisual.com'

# !hexo-artitalk-static
artitalk:
  enable: true
  title: 说说 | Essay ## 标题
  path: essay/index.html ## 生成路径
  pageSize: 20 ## 显示几条说说
  avatar: https://gcore.jsdelivr.net/gh/XenWayne/sitefile/img/avatar.webp ## 说说头像
  plugins: [] ## 插件，具体请看下文
  template: ## 说说模板，可查看仓库中的 main.ejs
  imports: ## 在说说模板的开头和结尾处插入内容
    before:
      - <p>这里是一些碎碎念，又或是一些过于简短不能形成文章的想法和回忆录，亦或是一些情绪垃圾。</p>
      - <p>一般不emo也不会来这写东西= =</p>
      - <p>Just take it easy.</p>
      - <p>Generated by <a href="https://github.com/Lete114/hexo-artitalk-static">hexo-artitalk-static</a>.</p>
      - <hr>
    after: 
      -
    # - <link rel="stylesheet" href="/css/index.css">
    # - '<style>body{color: red}</style>' ## 注意由于css的‘{}’是关键符号所以需要(单/双)引号''
    # - <script>alert(1)</script>

