    1.准备远离LOL了，不是这块料，有点脱离游戏本质了。幽默这一块，正好给硬盘腾点空间。或者说所有竞技游戏就是有输，有挫败感，又需要相当一段时间对游戏建立理解，别人只会觉得你的理解很搞笑。学那些玩意太累了，就那点事没完没了的念叨，相比于吃压力我还是不跟你们掺和了。  
    
    -----------

    2.这周出一礼拜差，正好撞上感冒，脑瓜嗡嗡的。 
    
    -----------
     
    3.街上有家卖红枣糕的，卖相倒是一般，但是巨好吃。 就是一锅出的小慢，想吃得靠缘分，哈哈。  
    ![](https://oss.xenwayne.top/img/2026/01/861d5e74c226aa9927a0bd077a2ef480.webp)
    
    -----------
    
    4.走道上大脑放空突然想起一个中学时候的事，既然想起来了就记一下吧，万一哪天失忆了呢，这故事我记得也给我大学室友讲过。当时毕业让文艺委员拽一群学生代表去单独搞个节目，排练那会指导的音乐老师还搁那*一脸惊讶的*跟我讲，“噢？你跑调啊，哈哈哈。”  我真是忘不了她那个诡异的表情，
    后面要去录音棚，她还专门拽我出来叮嘱我一会小点声，唉讲道理你整这一出你别让我来不就好了吗。印象里是要给到时候舞台录个音轨，两个人一个麦，然后各自都戴一个监听。   
    后来的事就很容易预料了，尽管我尽量降低自己的存在感，但是录音师的耳朵又不是吃素的，每个音轨单独在每个人耳机里响一边，最后说八号位左边的那个男生你下去吧。  当时我情绪上倒是没啥感觉，就是觉得挺莫名其妙的，
    去录音室角落坐着找了个roguelike打发时间，虽然后面给手机玩没电了说是。  然后旁边的人包括文艺委员啥的就过来给我道歉啥的，有点搞笑。  
    最近怎么说呢，有点类似的经历，但是跟唱歌啥的没关系，不展开了。  
    顺带一提本人现在依旧五音不全，又有什么关系呢。  
        
    -----------
    
    5.最后还是受不了手里的红米Note 12 Turbo，这应该大二大三那会买的吧应该，也三年了。  本来我想多等等看屏下摄像头的旗舰有没有更新的选择，中兴家的生态我真的不是很能接受。  
    但是又权衡了一圈感觉米就算有了价格应该也很感人，最近手里这个我感觉soc应该是有点虚焊，续航也有点抽象了，购入了个K90，坐等到货。
