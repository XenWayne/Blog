- content: |
    今天体测一千米跑完有点虚，下午睡多了晚上躺床上睡不着开始过走马灯。想到点又气又怀念的事，写在这里给未来的我看看吧，即使我可能不会有下一代。
    讲道理小时候最气不过的就是父母不尊重你作为「个人」的时候。小时候人在农村，正读读小学二三年级吧差不多。在学校忘了跟谁学的了，喜欢拿那种可湿水的面巾纸折蝴蝶结，放学回家为了搞这东西还特意去买的纸，具体的现在是忘干净了，当年折完一堆我还特意拿外面洗干净了放一边等着干透了之后放哪做装饰。很没用对吧，但是当时就是喜欢，很珍视这个东西。结果出门回来就发现那一堆被我妈扔进火堆里了，按她的说法就是「我以为这些东西没用啊」，当时的场景就是我急得都要哭了，但她完全没理解我的愤怒点在哪。闹了半天得到的解释就是「你再搞一遍吧」，直到最后我都没有得到一个真正放下姿态的道歉。
    按自己的回忆和周围人的叙述，我脾气绝对算不上好，按我现在的视角观察，我是非常在乎很多事情第一次的结果，举个最简单的例子，一个棒棒糖掉在地上，我很苦恼，即使给我一个新的，我也会对刚才掉下去一根棒棒糖这件事本身耿耿于怀，就是这么一个人。
    写的有点啰嗦了，不过我躺床上也就是想到哪写哪，其实很多时候父母只缺一个放低姿态来带入式思考的行为。这个事你说我气么，那肯定很气，不然我也不能在十几年后的今天仍然清晰复述细节。但也不至于说现在当她面翻旧账(，当然她本人估计九成是没啥印象，哈哈，现在看来就是一个小插曲罢了。给自己写东西就不用叠甲了，就这样吧，晚安。
    XenWayne 2023.10.16 凌晨随笔
