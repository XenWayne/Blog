    对业务人员梁木了，防火墙NAT做完对面说应用一直报403，我看了一眼你这403是Nginx报的跟我防火墙有什么关系，问了一嘴对面Nginx
    做了什么基于客户端IP的访问控制，人家说没有。 后面我拿到应用服务器的凭据登上去瞅了一眼Nginx的配置文件，打眼一瞅就有一个`include /etc/nginx/access_control.conf;`  
    果不其然里面只允许内网IP访问相关路径，无语的同时我选择给DNAT套一个SNAT，无所谓了，总之让他能访问就可以了，虽然Nginx的log里全是来自防火墙地址的请求😅
