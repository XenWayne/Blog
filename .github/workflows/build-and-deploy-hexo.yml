name: Build and Deploy Hexo
on:
  push:
    branches:
      - local
jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      # 相当于 git clone 到服务器
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # 必须获取完整提交历史

      # 替换 deploy.yml 中的 commit sha (指定为7位短SHA)
      - name: Commit SHA Injection to deploy.yml 🔄
        run: |
          SHORT_SHA=$(git rev-parse --short=7 ${{ github.sha }})
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          
          # 使用变量替换内容
          sed -i "s|^sha:.*$|sha: '<a href=\"$COMMIT_URL\">$SHORT_SHA</a>'|" ./source/_data/deploy.yml

      # 安装依赖
      - name: Install 🔧
        run: |
          npm install -g hexo-cli --save
          npm install
      
      # Bangumi插件拉取数据
      - name: Bangumi 📺
        run: |
          hexo bangumi -u
          hexo game -u

      # 生成页面
      - name: Build 🪧
        run: |
          hexo generate

      # 部署
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          branch: pages   # 存储站点的分支
          folder: public     # 构建出来的待部署的站点文件夹名称
